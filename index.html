<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login form</title>
    <link href="./src/output.css" rel="stylesheet" />
  </head>
  <body
    class="bg-gray-900 flex items-center justify-center min-h-screen text-white"
  >
    <div class="bg-gray-700 p-8 rounded-2xl shadow-lg max-w-sm w-full">
      <h2 class="text-center text-3xl mb-6 font-bold">Login</h2>
      <form action="">
        <div class="mb-4">
          <label
            class="block text-sm font-medium text-gray-300 mb-1"
            for="email"
            >Email</label
          >
          <input
            class="w-full px-3 py-2 bg-gray-600 border-gray-500 focus:outline-none focus:ring-1 focus:ring-blue-500 rounded"
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
          />
        </div>
        <div class="mb-4">
          <label
            class="block text-sm font-medium text-gray-300 mb-1"
            for="password"
            >Password</label
          >
          <input
            class="w-full px-3 py-2 bg-gray-600 border-gray-500 focus:outline-none focus:ring-1 focus:ring-blue-500 rounded"
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
          />
        </div>
        <div>
          <button
            type="submit"
            class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded shadow-2xl"
          >
            Login
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
